{% extends "core/base.html" %}
{% block title %}— Entrer score{% endblock %}
{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-5">
        <div class="card p-4">
            <h4 class="fw-bold mb-1">Entrer les scores</h4>
            <p class="text-muted mb-4">{{ match.player1.name }} vs {{ match.player2.name }}</p>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3"><label class="form-label fw-semibold">Score — {{ match.player1.name }}</label>{{ form.score1 }}</div>
                <div class="mb-3"><label class="form-label fw-semibold">Score — {{ match.player2.name }}</label>{{ form.score2 }}</div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-danger flex-grow-1">Valider</button>
                    <a href="{% url 'matches' %}" class="btn btn-outline-secondary">Annuler</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
