{% extends "core/base.html" %}
{% block title %}— Connexion{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card p-4">
            <h3 class="mb-4 fw-bold">Connexion</h3>
            <form method="post">
                {% csrf_token %}
                {% for field in form %}
                <div class="mb-3">
                    <label class="form-label fw-semibold">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}<div class="text-danger small mt-1">{{ field.errors.0 }}</div>{% endif %}
                </div>
                {% endfor %}
                <button type="submit" class="btn btn-danger w-100">Se connecter</button>
            </form>
            <p class="mt-3 text-center text-muted">Pas de compte ? <a href="{% url 'register' %}">Créer un compte</a></p>
        </div>
    </div>
</div>
{% endblock %}
